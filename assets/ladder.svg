<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="470" role="img" aria-label="Two-step picker. Step 1, model, from how hard and how big the task is. Claude: score 0 to 1 Haiku, 2 to 6 Sonnet, 7 to 9 Opus. ChatGPT and Codex: 0 to 1 Luna, 2 to 3 Terra, 4 to 6 Sol, 7 to 9 Astra. Step 2, effort, from how hard, risky and unclear the task is, same for both: 0 to 1 low or light, 2 to 4 medium, 5 to 7 high, 8 to 9 extra high.">
