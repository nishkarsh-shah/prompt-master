<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="600" role="img" aria-label="Two-step picker. Step 1, model, from how hard and how big the task is: score 0 to 1 Haiku or Luna, 2 to 3 Sonnet or Terra, 4 to 6 Sonnet or Sol, 7 to 9 Opus or Astra. Step 2, effort, from how hard, risky and unclear the task is: score 0 to 1 low, 2 to 4 medium, 5 to 7 high, 8 to 9 extra high.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .t{font-size:15px;font-weight:700;fill:#f3f2ea}
    .h{font-size:14px;font-weight:700}
    .l{font-size:13px;fill:#a7aca8}
    .n{font-size:13.5px;font-weight:600;fill:#f3f2ea}
    .sc{font-size:11.5px;fill:#d9dcd6}
    @media (max-width:520px){ .n{font-size:12.5px} .l{font-size:12px} .sc{font-size:11px} .t{font-size:14px} }
  </style>
  <rect x="0.5" y="0.5" width="99.9%" height="599" rx="16" fill="#16191c" stroke="rgba(243,242,234,0.14)"/>

  <text class="t" x="3%" y="34">Step 1 · Model</text>
  <text class="l" x="3%" y="55">From how hard and how big the task is</text>

  <svg x="3%" y="0" width="45%" height="300" overflow="visible">
    <text class="h" x="0" y="86" fill="#ff5a4a">Claude</text>
    <rect x="0" y="98" width="100%" height="40" rx="8" fill="#ff5a4a" fill-opacity="0.1" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="123">Haiku</text>
    <text class="sc" x="100%" dx="-11" y="123" text-anchor="end">score 0–1</text>
    <rect x="0" y="148" width="100%" height="40" rx="8" fill="#ff5a4a" fill-opacity="0.22" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="173">Sonnet</text>
    <text class="sc" x="100%" dx="-11" y="173" text-anchor="end">score 2–3</text>
    <rect x="0" y="198" width="100%" height="40" rx="8" fill="#ff5a4a" fill-opacity="0.22" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="223">Sonnet</text>
    <text class="sc" x="100%" dx="-11" y="223" text-anchor="end">score 4–6</text>
    <rect x="0" y="248" width="100%" height="40" rx="8" fill="#ff5a4a" fill-opacity="0.6" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="273">Opus</text>
    <text class="sc" x="100%" dx="-11" y="273" text-anchor="end">score 7–9</text>
  </svg>

  <svg x="52%" y="0" width="45%" height="300" overflow="visible">
    <text class="h" x="0" y="86" fill="#3d8bff">ChatGPT and Codex</text>
    <rect x="0" y="98" width="100%" height="40" rx="8" fill="#3d8bff" fill-opacity="0.1" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="123">Luna</text>
    <text class="sc" x="100%" dx="-11" y="123" text-anchor="end">score 0–1</text>
    <rect x="0" y="148" width="100%" height="40" rx="8" fill="#3d8bff" fill-opacity="0.22" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="173">Terra</text>
    <text class="sc" x="100%" dx="-11" y="173" text-anchor="end">score 2–3</text>
    <rect x="0" y="198" width="100%" height="40" rx="8" fill="#3d8bff" fill-opacity="0.38" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="223">Sol</text>
    <text class="sc" x="100%" dx="-11" y="223" text-anchor="end">score 4–6</text>
    <rect x="0" y="248" width="100%" height="40" rx="8" fill="#3d8bff" fill-opacity="0.6" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="273">Astra</text>
    <text class="sc" x="100%" dx="-11" y="273" text-anchor="end">score 7–9</text>
  </svg>

  <text class="t" x="3%" y="340">Step 2 · Effort</text>
  <text class="l" x="3%" y="361">From how hard, risky and unclear the task is. Same for both.</text>

  <svg x="3%" y="0" width="94%" height="600" overflow="visible">
    <rect x="0" y="376" width="100%" height="40" rx="8" fill="#f3f2ea" fill-opacity="0.05" stroke="#f3f2ea" stroke-opacity="0.35"/>
    <text class="n" x="11" y="401">Low</text>
    <text class="sc" x="100%" dx="-11" y="401" text-anchor="end">score 0–1</text>
    <rect x="0" y="426" width="100%" height="40" rx="8" fill="#f3f2ea" fill-opacity="0.1" stroke="#f3f2ea" stroke-opacity="0.35"/>
    <text class="n" x="11" y="451">Medium</text>
    <text class="sc" x="100%" dx="-11" y="451" text-anchor="end">score 2–4</text>
    <rect x="0" y="476" width="100%" height="40" rx="8" fill="#f3f2ea" fill-opacity="0.16" stroke="#f3f2ea" stroke-opacity="0.35"/>
    <text class="n" x="11" y="501">High</text>
    <text class="sc" x="100%" dx="-11" y="501" text-anchor="end">score 5–7</text>
    <rect x="0" y="526" width="100%" height="40" rx="8" fill="#f3f2ea" fill-opacity="0.24" stroke="#f3f2ea" stroke-opacity="0.35"/>
    <text class="n" x="11" y="551">Extra high</text>
    <text class="sc" x="100%" dx="-11" y="551" text-anchor="end">score 8–9</text>
  </svg>
</svg>
